<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <!-- Left: Belgium (Black, Yellow, Red) -->
  <g opacity="0.95">
    <rect width="100" height="600" fill="#000000"/>
    <rect x="100" width="100" height="600" fill="#ffd90c"/>
    <rect x="200" width="100" height="600" fill="#ed2939"/>
  </g>
  <!-- Middle: Netherlands (Red, White, Blue) -->
  <g opacity="0.95">
    <rect x="300" width="300" height="200" fill="#ae1c28"/>
    <rect x="300" y="200" width="300" height="200" fill="#ffffff"/>
    <rect x="300" y="400" width="300" height="200" fill="#21468b"/>
  </g>
  <!-- Right: Luxembourg (Red, White, Light Blue) -->
  <g opacity="0.95">
    <rect x="600" width="300" height="200" fill="#ea141d"/>
    <rect x="600" y="200" width="300" height="200" fill="#ffffff"/>
    <rect x="600" y="400" width="300" height="200" fill="#00a1de"/>
  </g>
</svg>
